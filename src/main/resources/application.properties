spring.application.name=cs2
server.port=${PORT:8080}

# Persistencia en Base de Datos H2 (archivo local)
spring.datasource.url=jdbc:h2:file:./data/armas;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Documentación OpenAPI 3 y Swagger UI (POO-09)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Nivel de Log DEBUG para trazabilidad de integración con servicios externos (POO-09)
logging.level.py.edu.uc.lp3=DEBUG

# Configuración externalizable de los servicios de compañeros A2 y A3 (POO-09 Round Robin)
cs2.peers.a2.nombre=${A2_NOMBRE:Matias Enciso (A2)}
cs2.peers.a2.base-url=${A2_BASE_URL:http://localhost:8081}
cs2.peers.a2.endpoint=${A2_ENDPOINT:/api/simulacion/explosion}
cs2.peers.a2.openapi-url=${A2_OPENAPI_URL:http://localhost:8081/v3/api-docs}

cs2.peers.a3.nombre=${A3_NOMBRE:Fabricio Gonzalez (A3)}
cs2.peers.a3.base-url=${A3_BASE_URL:http://localhost:8082}
cs2.peers.a3.endpoint=${A3_ENDPOINT:/api/reglas/danio}
cs2.peers.a3.openapi-url=${A3_OPENAPI_URL:http://localhost:8082/v3/api-docs}

# API REST externa de práctica vista en clase
cs2.external.restful-api-url=${EXTERNAL_API_URL:https://api.restful-api.dev/objects}
